<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit {{ product.name }} - TechHub Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #212529; padding: 40px 20px; }
    .container { max-width: 750px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.06); border: 1px solid #edf2f7; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
    h1 { font-size: 20px; font-weight: 700; color: #1a1c20; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 700; color: #4a5568; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 14px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #8B0000; }
    .current-img-preview { display: flex; align-items: center; gap: 14px; padding: 12px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 16px; }
    .current-img-preview img { width: 60px; height: 60px; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid #cbd5e1; }
    .actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
    .btn-save { background: #8B0000; color: white; border: none; padding: 11px 22px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-save:hover { background: #a50000; }
    .btn-cancel { background: #e2e8f0; color: #475569; text-decoration: none; padding: 11px 20px; border-radius: 8px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; }
    .btn-cancel:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✏️ Edit Product #{{ product.id }}</h1>
      <a href="/admin" class="btn-cancel">← Back to Catalog</a>
    </header>

    <form action="/admin/product/update/{{ product.id }}" method="POST" enctype="multipart/form-data">
      <div class="form-grid">
        <div>
          <label>Product Name</label>
          <input type="text" name="name" value="{{ product.name }}" required>
        </div>
        <div>
          <label>Brand</label>
          <input type="text" name="brand" value="{{ product.brand }}" required>
        </div>
        <div>
          <label>Category</label>
          <select name="category_id" required>
            {% for cat in categories %}
              <option value="{{ cat.id }}" {% if cat.id == product.category_id %}selected{% endif %}>
                {{ cat.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label>Price ($ USD)</label>
          <input type="number" step="0.01" name="price" value="{{ product.price }}" required>
        </div>
        <div>
          <label>Stock Quantity</label>
          <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}" required>
        </div>
      </div>

      <!-- Current Image Display and New File Upload -->
      <div class="current-img-preview">
        {% if product.image_url %}
          <img src="{{ product.image_url }}" alt="Product Image">
        {% else %}
          <div style="width: 60px; height: 60px; background: #e2e8f0; display:flex; align-items:center; justify-content:center; font-size:11px; border-radius:6px; color:#64748b;">No Img</div>
        {% endif %}
        <div style="flex: 1;">
          <label>Replace Picture (Optional)</label>
          <input type="file" name="image" accept="image/*">
        </div>
      </div>

      <div style="margin-bottom: 18px;">
        <label>Description & Specs</label>
        <textarea name="description" rows="3">{{ product.description }}</textarea>
      </div>

      <div class="actions">
        <a href="/admin" class="btn-cancel">Cancel</a>
        <button type="submit" class="btn-save">Update Product</button>
      </div>
    </form>
  </div>
</body>
</html>
